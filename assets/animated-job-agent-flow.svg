<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Job application workflow: discover, qualify, draft, review, export</title>
  <desc id="desc">Animated architecture diagram of the shipped LangGraph workflow. Three ingestion tiers feed DNS and SMTP contact verification, deterministic qualification and ranking, structured outreach writing, a Python harness and model critic, optional human review, and CSV and Excel export. Candidate evidence stays read-only. Failed drafts return to the writer while the failure count is below two; reaching the cap still advances to dispatch. The diagram is illustrative, not live telemetry.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#090d16"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#243148" stroke-opacity=".24"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker>
  </defs>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#e2e8f0;font-size:14px}
    .title{font-size:23px;font-weight:700;letter-spacing:.5px}.section{font-size:13px;font-weight:700;letter-spacing:1.5px}.heading{font-size:18px;font-weight:700}.muted{fill:#94a3b8;font-size:12px}.mono{font-family:Consolas,monospace;font-size:12px}.cyan{fill:#67e8f9}.green{fill:#5eead4}.violet{fill:#c4b5fd}.amber{fill:#fbbf24}
    .card{fill:#111d30;stroke:#334155;stroke-width:1.2}.wire{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.flow{fill:none;stroke:#38bdf8;stroke-width:1.6;stroke-dasharray:6 7;animation:flow 1.5s linear infinite}.feedback{stroke:#a78bfa}.evidence{fill:none;stroke:#fbbf24;stroke-width:1.4;stroke-dasharray:4 5}.pulse{animation:pulse 3s ease-in-out infinite}.packet{fill:#67e8f9}
    @keyframes flow{to{stroke-dashoffset:-26}}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}.packet{display:none}}
  </style>
  <rect width="1200" height="900" rx="24" fill="url(#background)"/>
  <rect width="1200" height="900" rx="24" fill="url(#grid)"/>
  <rect x="32" y="30" width="5" height="37" rx="2" fill="url(#accent)"/>
  <text x="50" y="47" class="title">JOB APPLICATION / GUARDED AGENTIC WORKFLOW</text>
  <text x="50" y="70" class="muted">Python owns routing. Models extract, write, and score. Candidate evidence stays read-only.</text>
  <rect x="956" y="28" width="210" height="27" rx="13" fill="#17283d" stroke="#24516b"/>
  <circle cx="973" cy="41" r="4" fill="#22d3ee" class="pulse"/>
  <text x="987" y="45" class="mono cyan">ILLUSTRATIVE FLOW</text>

  <!-- Lane A: ingestion and verified contacts. -->
  <rect x="24" y="94" width="1152" height="150" rx="16" fill="#0b1727" stroke="#164e63"/>
  <text x="42" y="119" class="section cyan">01 / DISCOVER &amp; INGEST</text>
  <rect x="42" y="136" width="246" height="87" rx="11" class="card"/>
  <text x="58" y="162" class="heading">Job sources</text>
  <text x="58" y="186">URL · local JD · web search</text>
  <text x="58" y="207" class="muted">ddgs → Remotive / Arbeitnow fallback</text>
  <path d="M288 179H326" class="wire"/><path d="M288 179H326" class="flow"/>
  <rect x="328" y="136" width="356" height="87" rx="11" class="card"/>
  <text x="344" y="162" class="heading">Scout / resilient ingestion</text>
  <text x="344" y="186">Raw text → Jina Reader → direct HTML</text>
  <text x="344" y="207" class="muted">HTTP retries · BeautifulSoup fallback</text>
  <path d="M684 179H722" class="wire"/><path d="M684 179H722" class="flow"/>
  <rect x="724" y="136" width="434" height="87" rx="11" class="card"/>
  <text x="740" y="162" class="heading">Contact verification</text>
  <text x="740" y="186">Syntax / ATS → DNS MX → SMTP + catch-all</text>
  <text x="740" y="207" class="muted">Guessed contacts require smtp_verified · no DATA sent</text>
  <path d="M1080 223V258H164V320" class="wire"/>
  <path d="M1080 223V258H164V320" class="flow"/>

  <!-- Lane B: the five-node graph, with bounded feedback. -->
  <rect x="24" y="276" width="1152" height="270" rx="16" fill="#10172a" stroke="#293855"/>
  <text x="42" y="300" class="section">02 / QUALIFY → WRITE → EVALUATE → REVIEW</text>
  <rect x="42" y="320" width="244" height="130" rx="12" class="card"/>
  <text x="58" y="347" class="heading green">Gatekeeper</text>
  <text x="58" y="373">YOE ≤ 3 · degree / role gates</text>
  <text x="58" y="395">Core anchor · skill match ≥ 40%</text>
  <rect x="57" y="413" width="213" height="23" rx="5" fill="#12302e"/>
  <text x="67" y="429" class="mono green">Rank experience + projects</text>
  <path d="M286 383H324" class="wire"/><path d="M286 383H324" class="flow"/>
  <rect x="326" y="320" width="244" height="130" rx="12" class="card"/>
  <text x="342" y="347" class="heading cyan">Outreach writer</text>
  <text x="342" y="373">Email ≤ 180 words</text>
  <text x="342" y="395">LinkedIn ≤ 400 characters</text>
  <rect x="341" y="413" width="214" height="23" rx="5" fill="#102c40"/>
  <text x="351" y="429" class="mono cyan">Groq / gpt-oss-120b</text>
  <path d="M570 383H608" class="wire"/><path d="M570 383H608" class="flow"/>
  <rect x="610" y="320" width="244" height="130" rx="12" class="card"/>
  <text x="626" y="347" class="heading violet">Critic + harness</text>
  <text x="626" y="373">Python allowlists first</text>
  <text x="626" y="395">Then grounding / specificity</text>
  <rect x="625" y="413" width="214" height="23" rx="5" fill="#27213e"/>
  <text x="635" y="429" class="mono violet">Groq / gpt-oss-20b judge</text>
  <path d="M854 383H892" class="wire"/><path d="M854 383H892" class="flow"/>
  <rect x="894" y="320" width="264" height="130" rx="12" fill="#242230" stroke="#b68e35"/>
  <text x="910" y="347" class="heading amber">Human review / optional</text>
  <text x="910" y="373">Pause before dispatch_lead</text>
  <text x="910" y="395">approve → export · skip → end</text>
  <rect x="909" y="413" width="234" height="23" rx="5" fill="#392e1c"/>
  <text x="919" y="429" class="mono amber">FastAPI HITL · CLI bypasses</text>
  <path d="M732 450V483H448V450" class="wire feedback"/>
  <path d="M732 450V483H448V450" class="flow feedback"/>
  <text x="588" y="506" text-anchor="middle" class="mono violet">FAILED + COUNT &lt; 2 → COMPACT FEEDBACK → REWRITE</text>
  <path d="M164 450V487" class="wire"/>
  <rect x="54" y="490" width="220" height="30" rx="15" fill="#2a1d2c" stroke="#6b3549"/>
  <text x="164" y="509" text-anchor="middle" class="muted" style="fill:#fda4af">Scrape failure / ineligible → END</text>
  <text x="1156" y="533" text-anchor="end" class="muted amber">Pass OR failure cap reached → dispatch route</text>

  <!-- Lane C: evidence and the only write side effect. -->
  <text x="42" y="582" class="section">03 / READ-ONLY EVIDENCE &amp; DETERMINISTIC EXPORT</text>
  <path d="M164 610V561H306V430H326" class="evidence"/>
  <path d="M1026 450V610" class="wire"/><path d="M1026 450V610" class="flow"/>
  <rect x="42" y="610" width="388" height="120" rx="12" fill="#1c211f" stroke="#655730"/>
  <text x="60" y="638" class="heading amber">Candidate evidence</text>
  <text x="60" y="663" class="mono">candidate_profile.yaml</text>
  <text x="60" y="685">Skills · experience IDs · URLs · locked metrics</text>
  <text x="60" y="709" class="muted">Master resume PDF is never rewritten</text>
  <rect x="462" y="610" width="244" height="120" rx="12" class="card"/>
  <text x="478" y="638" class="heading">Export contract</text>
  <text x="478" y="663" class="mono">SHA-256(company::role)[:12]</text>
  <text x="478" y="685">CSV-backed deduplication</text>
  <text x="478" y="709" class="muted">Repeated leads → DUPLICATE_SKIPPED</text>
  <rect x="738" y="610" width="420" height="120" rx="12" fill="#112c2a" stroke="#2dd4bf"/>
  <text x="756" y="638" class="heading green">Dispatch lead → END</text>
  <text x="756" y="663" class="mono">outputs/vetted_job_leads.xlsx</text>
  <text x="756" y="685" class="mono">outputs/vetted_job_leads.csv</text>
  <text x="756" y="709" class="muted">Exports drafts + resume path · does not send outreach</text>
  <path d="M706 670H736" class="wire"/>

  <!-- Regression gates are a separate test path, never live telemetry. -->
  <rect x="24" y="758" width="1152" height="108" rx="16" fill="#0b1727" stroke="#24364b"/>
  <text x="42" y="785" class="section cyan">CI / FOUR DETERMINISTIC EVALUATION GATES</text>
  <text x="42" y="813">Qualification / routing</text><text x="42" y="841" class="heading green">6 / 6 golden cases</text>
  <text x="326" y="813">Annotated top-1 ranking</text><text x="326" y="841" class="heading green">3 / 3 expectations</text>
  <text x="610" y="813">Numeric claim fixtures</text><text x="610" y="841" class="heading green">Supported / rejected</text>
  <text x="894" y="813">Injected skill violation</text><text x="894" y="841" class="heading green">Second draft recovers</text>
  <text x="42" y="886" class="muted">Illustrates source-defined behavior and regression assertions; no live latency, delivery, or model-accuracy telemetry.</text>

  <circle r="4" class="packet"><animateMotion dur="3s" repeatCount="indefinite" path="M288 179H684"/></circle>
  <circle r="4" class="packet"><animateMotion dur="7s" repeatCount="indefinite" path="M1080 223V258H164V320"/></circle>
  <circle r="4" class="packet"><animateMotion dur="5s" repeatCount="indefinite" path="M286 383H1026"/></circle>
  <circle r="4" class="packet" style="fill:#c4b5fd"><animateMotion dur="4s" repeatCount="indefinite" path="M732 450V483H448V450"/></circle>
  <circle r="4" class="packet"><animateMotion dur="3s" repeatCount="indefinite" path="M1026 450V610"/></circle>
</svg>
